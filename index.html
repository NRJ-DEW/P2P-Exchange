<style>

html{scroll-behavior:smooth;scroll-padding-top:calc(76px + env(safe-area-inset-top,0px))}
body{background:var(--bg);color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.glass{background:linear-gradient(145deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.glow{box-shadow:0 0 0 1px rgba(43,184,138,.35),0 6px 20px -8px rgba(43,184,138,.3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;background:var(--g);color:#03130a;font-weight:700;border-radius:.75rem;transition:transform .2s,box-shadow .2s,background .2s}
.btn:hover{transform:translateY(-2px);background:#3fc99b}
.grad{background:linear-gradient(90deg,#2bb88a,#86dcbc);-webkit-background-clip:text;background-clip:text;color:transparent}
.card{transition:transform .3s,border-color .3s}.card:hover{transform:translateY(-4px);border-color:rgba(43,184,138,.4)}
.fade{animation:fade .8s ease both}@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.float{animation:flt 6s ease-in-out infinite}@keyframes flt{50%{transform:translateY(-8px)}}
.spin{animation:sp 40s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.faq{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s}.faq.open{grid-template-rows:1fr}.faq>div{overflow:hidden}
.cta-pulse{animation:cp 2.4s ease-out infinite}@keyframes cp{0%{box-shadow:0 0 0 0 rgba(43,184,138,.55),0 8px 28px -6px rgba(43,184,138,.6)}70%,100%{box-shadow:0 0 0 14px rgba(43,184,138,0),0 8px 28px -6px rgba(43,184,138,.6)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

<body>
<noscript><img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=2605895846557110&ev=PageView&noscript=1" alt=""/></noscript>
<div id="root"></div>
<script>
const { useState, useEffect, createElement: h } = React;
const html = htm.bind(h);
const TG = "https://t.me/targethunter25?text=Hi%2C%20I%20am%20interested%20in%20your%20INR%20%3C-%3E%20USDT%20P2P%20exchange%20service.%20Please%20share%20the%20details.";
const BRAND = "[BRAND NAME]";

// Meta Pixel: Contact fires only on a Telegram CTA click. No Lead/Purchase events.
const trackContact = () => { try { if (typeof window.fbq === "function") { window.fbq("track", "Contact"); window.fbq("track", "Lead"); } } catch (e) {} };

const P = {
  arrow: ["M5 12h14", "m12 5 7 7-7 7"],
  send: ["m22 2-7 20-4-9-9-4Z", "M22 2 11 13"],
  swap: ["m8 3-4 4 4 4", "M4 7h16", "m16 21 4-4-4-4", "M20 17H4"],
  shield: ["M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z", "m9 12 2 2 4-4"],
  chat: ["M7.9 20A9 9 0 1 0 4 16.1L2 22Z"],
  file: ["M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z", "M14 2v4a2 2 0 0 0 2 2h4", "M10 9H8", "M16 13H8", "M16 17H8"],
  down: ["m6 9 6 6 6-6"],
  menu: ["M4 12h16", "M4 6h16", "M4 18h16"],
  x: ["M18 6 6 18", "m6 6 12 12"],
};
const Icon = ({ n, s = 20, c = "" }) => html`<svg width=${s} height=${s} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class=${c} aria-hidden="true">${P[n].map((d, i) => html`<path key=${i} d=${d}/>`)}</svg>`;

const TgBtn = ({ children, cls = "", icon = true }) => html`
  <a href=${TG} target="_blank" rel="noopener noreferrer" onClick=${trackContact} class=${"btn " + cls}>${children}${icon && html`<${Icon} n="arrow" s=${18}/>`}</a>`;

const Wrap = ({ children, cls = "", id }) => html`<section id=${id} class=${"relative px-5 sm:px-8 " + cls}><div class="mx-auto max-w-6xl">${children}</div></section>`;
const Head = ({ eyebrow, title, sub }) => html`
  <div class="mx-auto mb-8 max-w-2xl text-center sm:mb-12">
    ${eyebrow && html`<p class="mb-3 text-xs font-semibold uppercase tracking-[.2em] text-[#2bb88a]">${eyebrow}</p>`}
    <h2 class="text-3xl font-bold leading-tight tracking-tight sm:text-4xl">${title}</h2>
    ${sub && html`<p class="mt-4 text-white/60">${sub}</p>`}
  </div>`;

function Visual() {
  const Coin = ({ children, cls }) => html`<div class=${"glass grid place-items-center rounded-full " + cls}>${children}</div>`;
  return html`
  <div class="relative mx-auto aspect-square w-full max-w-[420px]" aria-hidden="true">
    <div class="absolute inset-6 rounded-full bg-[#2bb88a]/10 blur-3xl"></div>
    <svg class="spin absolute inset-0 h-full w-full" viewBox="0 0 400 400"><circle cx="200" cy="200" r="190" fill="none" stroke="rgba(43,184,138,.25)" stroke-dasharray="2 10" stroke-linecap="round"/><circle cx="200" cy="200" r="140" fill="none" stroke="rgba(255,255,255,.08)"/></svg>
    <${Coin} cls="float absolute left-[2%] top-[28%] h-[44%] w-[44%] shadow-2xl">
      <div class="text-center"><div class="text-5xl font-bold sm:text-6xl">₹</div><div class="mt-1 text-xs font-semibold tracking-widest text-white/60">INR</div></div>
    <//>
    <${Coin} cls="float absolute right-[2%] top-[28%] h-[44%] w-[44%] glow" style=${{ animationDelay: "-3s" }}>
      <div class="text-center"><div class="mx-auto grid h-14 w-14 place-items-center rounded-full bg-[#2bb88a] text-3xl font-black text-[#03130a] sm:h-16 sm:w-16">₮</div><div class="mt-2 text-xs font-semibold tracking-widest text-[#2bb88a]">USDT</div></div>
    <//>
    <div class="glass absolute left-1/2 top-1/2 z-10 grid h-14 w-14 -translate-x-1/2 -translate-y-1/2 place-items-center rounded-full text-[#2bb88a]"><${Icon} n="swap" s=${26}/></div>
  </div>`;
}

function Hero() {
  return html`
  <${Wrap} id="top" cls="overflow-hidden pt-10 pb-4 sm:pt-20 sm:pb-20 lg:pb-28">
    <div class="pointer-events-none absolute -top-40 left-1/2 h-[500px] w-[800px] -translate-x-1/2 rounded-full bg-[#2bb88a]/[.07] blur-[120px]"></div>
    <div class="relative grid items-center gap-2 lg:grid-cols-2 lg:gap-12">
      <div class="fade">
        <p class="glass mb-6 inline-block rounded-full px-4 py-1.5 text-[11px] font-semibold uppercase tracking-[.2em] text-[#2bb88a]">P2P Digital Asset Exchange</p>
        <h1 class="text-4xl font-extrabold leading-[1.1] tracking-tight sm:text-5xl lg:text-6xl">INR to USDT.<br/>USDT to INR.<br/><span class="grad">One Simple Connection.</span></h1>
        <p class="mt-6 max-w-xl text-base leading-relaxed text-white/65 sm:text-lg">Looking to exchange INR and USDT? Connect with our team to understand the P2P exchange process, available options and transaction requirements.</p>
        <div class="mt-6 flex flex-col gap-4 sm:mt-8 sm:flex-row sm:items-center">
          <${TgBtn} cls="glow px-7 py-4 text-base max-sm:!hidden">Connect on Telegram<//>
          <p class="text-sm text-white/50">Have questions? Our team is available on Telegram.</p>
        </div>
      </div>
      <div class="fade max-sm:flex max-sm:h-[230px] max-sm:items-center max-sm:overflow-hidden" style=${{ animationDelay: ".15s" }}><${Visual}/></div>
    </div>
  <//>`;
}

function Direction() {
  const cards = [
    ["INR → USDT", "Have INR and looking to acquire USDT? Connect with our team to discuss available exchange options and the applicable process."],
    ["USDT → INR", "Holding USDT and looking to exchange it for INR? Contact our team to understand the available process and requirements."],
  ];
  return html`
  <${Wrap} cls="pt-6 pb-8 sm:py-20">
    <${Head} title="Find the Exchange Direction You Need"/>
    <div class="grid gap-6 md:grid-cols-2">
      ${cards.map(([t, d]) => html`
      <article key=${t} class="glass card rounded-3xl p-6 sm:p-10">
        <div class="mb-6 inline-grid h-12 w-12 place-items-center rounded-xl bg-[#2bb88a]/10 text-[#2bb88a]"><${Icon} n="swap" s=${24}/></div>
        <h3 class="text-3xl font-bold">${t}</h3>
        <p class="mt-4 leading-relaxed text-white/60">${d}</p>
        <${TgBtn} cls="mt-8 px-6 py-3.5 text-sm">Enquire on Telegram<//>
      </article>`)}
    </div>
  <//>`;
}

function How() {
  const steps = [
    ["01", "Connect", "Start a conversation with our team on Telegram."],
    ["02", "Share Your Requirement", "Tell us whether you are looking for INR to USDT or USDT to INR."],
    ["03", "Understand the Process", "Discuss applicable rates, fees, eligibility, verification and transaction terms."],
    ["04", "Proceed After Verification", "Transactions can proceed only through the applicable verified and compliant process."],
  ];
  return html`
  <${Wrap} id="how" cls="pt-8 pb-2 sm:py-20">
    <${Head} eyebrow="How it works" title="A Simple Enquiry Process"/>
    <ol class="relative grid gap-8 lg:grid-cols-4 lg:gap-6">
      <div class="absolute left-[27px] top-2 bottom-2 w-px bg-gradient-to-b from-[#2bb88a]/60 to-transparent lg:left-[10%] lg:right-[10%] lg:top-[27px] lg:bottom-auto lg:h-px lg:w-auto lg:bg-gradient-to-r lg:from-[#2bb88a]/60 lg:via-[#2bb88a]/30 lg:to-[#2bb88a]/60"></div>
      ${steps.map(([n, t, d]) => html`
      <li key=${n} class="relative flex gap-5 lg:block lg:text-center">
        <div class="glass relative z-10 grid h-14 w-14 shrink-0 place-items-center rounded-full text-lg font-bold text-[#2bb88a] lg:mx-auto" style=${{ background: "#08110f" }}>${n}</div>
        <div class="lg:mt-6"><h3 class="text-lg font-semibold">${t}</h3><p class="mt-2 text-sm leading-relaxed text-white/60">${d}</p></div>
      </li>`)}
    </ol>
    <div class="mt-12 text-center max-sm:hidden"><${TgBtn} cls="px-7 py-3.5">Connect on Telegram<//></div>
  <//>`;
}

function Footer() {
  return html`
  <footer class="px-5 pb-28 pt-2 sm:px-8 md:pb-12 md:pt-6">
    <p class="mx-auto max-w-3xl border-t border-white/10 pt-4 text-center text-xs leading-relaxed text-white/45"><strong class="text-white/60">Risk Disclosure:</strong> Virtual Digital Assets involve significant risks, including price volatility and potential loss. Transactions are subject to applicable laws, verification requirements and service terms. This website does not provide investment advice.</p>
  </footer>`;
}

function App() {
  return html`<main><${Hero}/><${Direction}/><${How}/></main><${Footer}/>
  <div class="fixed inset-x-0 bottom-0 z-40 bg-gradient-to-t from-[#070b14] via-[#070b14]/90 to-transparent px-4 pb-4 pt-8 md:hidden" style=${{ paddingBottom: "calc(1rem + env(safe-area-inset-bottom,0px))" }}>
    <${TgBtn} cls="cta-pulse w-full py-4 text-[17px]" icon=${false}><${Icon} n="send" s=${18}/>Connect on Telegram<//>
  </div>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
</body>
